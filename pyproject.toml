[project]
name = "lambda-slack-bots"
version = "0.1.0"
description = "Slack bots running on AWS Lambda"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
cdk = [
    "aws-cdk-lib>=2.216.0",
    "constructs>=10.0.0,<11.0.0",
]
test = [
    "pytest>=8.0.0",
    "moto[ec2,ssm]>=5.0.0",
]

[tool.uv]
package = false